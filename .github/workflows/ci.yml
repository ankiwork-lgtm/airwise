name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (3.10 reached EOL on 2026-10-01) and newest stable CPython.
        python-version: ["3.11", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest with coverage (browser tests run in the browser job)
        run: pytest -m "not browser" --cov=airwise --cov-report=term-missing

      - name: Dependency audit
        run: pip-audit -r requirements-dev.lock --require-hashes --strict

  browser:
    # Playwright end-to-end tests on bundled Chromium. A separate job: they need a browser
    # download and take about 4 minutes locally, which the fast `checks` job should not wait for.
    runs-on: ubuntu-latest
    # About 4 minutes of tests plus roughly 2 minutes for pip and browser install; 20 minutes
    # leaves headroom for a slow runner while still failing a hung browser reasonably fast.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # Fail instead of skip when no browser can be launched, and fail if any test is skipped.
      AIRWISE_REQUIRE_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Oldest supported Python (single version: the browser behaviour does not depend on it).
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      # The Playwright version is pinned by requirements-dev.lock, so driver and browser match.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Browser tests
        run: pytest tests/browser -m browser --strict-markers -p no:cacheprovider --no-cov -rs

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
